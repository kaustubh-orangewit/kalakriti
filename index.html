<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KalaWiz</title>
<meta name="description" content="Clickable prototype of KalaWiz, a digital home for independent artists and creators in India.">
<meta name="theme-color" content="#F7F1E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F1E8;--card:#FFFDF9;--ink:#2B211B;--muted:#6B5D52;--line:#E6DACB;--line2:#D9C8B4;--acc:#1F4A3A;--acc-d:#9C4321;--olive:#5E6B47;--olive-soft:#E3EBDA;--olive-ink:#3F5530;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#EFE6DA;font-family:var(--sans);color:var(--ink)}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 16px 40px;box-sizing:border-box}
.topbar{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;width:100%}
.brand{font-family:var(--sans);font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1}
.caption{font-size:14px;color:var(--muted);max-width:460px;line-height:1.45}
.switch{display:grid;grid-template-columns:1fr 1fr;background:#E2D5C4;padding:4px;border-radius:14px;width:min(380px,100%);box-sizing:border-box}
.switch button{height:42px;border:none;border-radius:11px;background:transparent;font:600 14px var(--sans);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.switch button.on{background:var(--card);box-shadow:0 1px 3px rgba(60,35,20,.12)}
.dot{min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--acc-d);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.phone{width:390px;height:min(844px,calc(100vh - 250px));min-height:560px;border-radius:46px;background:#1E1712;padding:10px;box-shadow:0 30px 70px -24px rgba(60,35,20,.5);box-sizing:content-box}
.screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media (max-width:520px){
  .page{padding:0;gap:0;min-height:100dvh}
  .topbar{padding:8px 12px;width:100%;box-sizing:border-box;gap:0}
  .brand,.caption{display:none}
  .switch{width:100%}
  .phone{width:100%;height:calc(100dvh - 58px);border-radius:0;padding:0;box-shadow:none;background:none}
  .screen{border-radius:0}
}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.pad{padding:20px 20px 28px;display:flex;flex-direction:column;gap:18px}
.h1{font-family:var(--serif);font-size:32px;font-weight:700;margin:0;line-height:1.05}
.h2{font-family:var(--serif);font-size:25px;font-weight:600;margin:0}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
button{font-family:inherit;cursor:pointer;color:inherit}
.btn{height:52px;border:none;border-radius:14px;background:var(--acc);color:#fff;font-size:16px;font-weight:600;width:100%}
.btn:hover{filter:brightness(1.05)}
.btn.sm{height:44px;font-size:14px;width:auto;padding:0 16px;border-radius:12px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--ink)}
.btn.dark{background:var(--ink)}
.btn.olive{background:var(--olive-ink)}
.pill{flex:none;height:40px;padding:0 16px;border-radius:20px;font-size:14px;font-weight:500;border:1px solid #E2D4C3;background:var(--card);color:var(--ink)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.acc.on{background:var(--acc);border-color:var(--acc)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid #E2D4C3;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none;position:relative;padding:0}
.iconbtn.float{position:absolute;top:16px;left:16px;border:none;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:13px;font-weight:600;color:#4A3D34}
.input{height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:#fff;font:15px var(--sans);color:var(--ink);box-sizing:border-box;width:100%}
textarea.input{height:auto;padding:12px;line-height:1.5;resize:none;font-size:14px}
.input.err{border-color:var(--acc)}
.badge{flex:none;padding:4px 10px;border-radius:10px;font-size:12px;font-weight:600}
.img{display:block;width:100%;object-fit:cover;background:#E9DCCB}
.nav{flex:none;height:72px;display:grid;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--acc)}
.note{display:flex;gap:10px;padding:14px;border-radius:14px;background:var(--olive-soft);color:var(--olive-ink);font-size:13px;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.bar{display:block;width:100%;height:10px;border-radius:5px;background:#F1E7DC;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.toggle{flex:none;width:48px;height:28px;border-radius:14px;background:#C9BCAE;display:flex;align-items:center;padding:3px;box-sizing:border-box;justify-content:flex-start}
.toggle.on{background:var(--olive);justify-content:flex-end}
.toggle i{width:22px;height:22px;border-radius:11px;background:#fff}
.toast{position:absolute;left:16px;right:16px;bottom:88px;padding:14px 16px;border-radius:14px;background:var(--ink);color:#fff;font-size:14px;font-weight:500;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .25s ease}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.pulse{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.4}}
.avatar{flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden;object-fit:cover}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.noscript{padding:40px;text-align:center}
@media (max-height:900px) and (min-width:521px){
  .page{padding-top:12px;gap:10px;padding-bottom:12px}
  .caption{display:none}
  .brand{font-size:28px}
  .topbar{gap:8px}
  .phone{height:min(844px,calc(100vh - 140px))}
}
@media (pointer:fine){
  .scroll{scrollbar-width:thin;scrollbar-color:#CDBBA6 transparent}
  .scroll::-webkit-scrollbar{display:block;width:6px}
  .scroll::-webkit-scrollbar-thumb{background:#CDBBA6;border-radius:3px}
  .scroll,.hscroll{cursor:grab}
  .dragging,.dragging *{cursor:grabbing!important;user-select:none!important}
}

</style>
</head>
<body>
<div id="root"></div>
<noscript><div class="noscript">Please enable JavaScript to view the Kalakriti prototype.</div></noscript>

/* deterministic pseudo-QR for tickets */
function QR({ seed, size = 132 }) {
  const N = 21; let x = 0;
  for (const ch of seed) x = (x * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; };
  const finder = (r, c) => { for (const [fr, fc] of [[0, 0], [0, 14], [14, 0]]) { const rr = r - fr, cc = c - fc; if (rr >= 0 && rr < 7 && cc >= 0 && cc < 7) return (rr === 0 || rr === 6 || cc === 0 || cc === 6 || (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4)) ? 1 : 0; } return -1; };
  const cells = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const f = finder(r, c); const on = f === -1 ? rnd() > 0.52 : f === 1; if (on) cells.push(html`<rect key=${r + '-' + c} x=${c} y=${r} width="1" height="1" />`); }
  return html`<svg role="img" aria-label="Ticket QR code" width=${size} height=${size} viewBox="-1 -1 23 23" style=${{ background: '#fff', borderRadius: 8 }}><g fill="#2B211B">${cells}</g></svg>`;
}

  const showNav = ['home', 'following', 'bookings'].includes(s.screen);
  return html`<div className="screen">

  </div>`;
}

        <div className="card" style=${{ padding: 16, borderRadius: 18, display: 'flex', flexDirection: 'column', gap: 14 }}>
          <b style=${{ fontSize: 15 }}>Describe it in your own words</b>

          ${s.ai === 'listening' && html`<div style=${{ height: 64, borderRadius: 32, background: '#F1DFD3', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, fontSize: 15, fontWeight: 600, color: '#9C4321' }}><span className="pulse" style=${{ width: 12, height: 12, borderRadius: 6, background: '#1F4A3A' }}></span>Listening…</div>`}
          ${s.ai === 'thinking' && html`<div className="pulse" style=${{ height: 64, borderRadius: 32, background: '#ECE6DF', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 15, fontWeight: 600, color: '#4A3D34' }}>Writing your listing…</div>`}

          <div style=${{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}><b style=${{ fontSize: 15 }}>Your listing</b><span className="badge" style=${{ background: '#E3E9F3', color: '#2D4A73' }}>Written by AI · edit anything</span></div>

          <div className="grid2" style=${{ gap: 10 }}><button className="btn ghost" style=${{ height: 48, fontSize: 15 }} onClick=${startVoice}>Speak again</button><button className="btn" style=${{ height: 48, fontSize: 15 }} onClick=${publish}>Publish</button></div>
        </div>`}

  }

  const SUB = { dash: s.pf.studio + ' · Pune', catalog: s.products.length + ' pieces · ' + s.workshops.length + ' workshops', orders: newCount + ' new · ' + s.orders.length + ' this month', profile: 'How customers see you', notifs: unread + ' unread', workshop: 'Attendees & check-in', add: 'New listing', newws: 'New workshop' };
  const navT = MAIN.includes(s.tab) ? s.tab : ['workshop', 'add', 'newws'].includes(s.tab) ? 'catalog' : null;
  return html`<div className="screen">
    <header style=${{ flex: 'none', display: 'flex', alignItems: 'center', gap: 10, padding: '14px 16px 12px 20px', borderBottom: '1px solid #E6DACB' }}>

        <span style=${{ fontFamily: 'var(--sans)', fontSize: 24, fontWeight: 800, lineHeight: 1, letterSpacing: '-.02em' }}><span style=${{ color: '#1F4A3A' }}>Kala</span><span style=${{ color: '#B5532E' }}>Wiz</span> <span style=${{ fontFamily: 'var(--sans)', fontSize: 13, fontWeight: 600, color: '#2B211B', letterSpacing: '.06em' }}>STUDIO</span></span>
        <span className="muted" style=${{ fontSize: 13 }}>${SUB[s.tab]}</span>
      </div>
      <button onClick=${() => s.tab !== 'notifs' && push('notifs')} aria-label=${'Notifications, ' + unread + ' unread'} className="iconbtn">
        <${Icon} n="bell" s="21" c="#2B211B" />
        ${unread > 0 && html`<span style=${{ position: 'absolute', top: -2, right: -2, minWidth: 20, height: 20, padding: '0 5px', boxSizing: 'border-box', borderRadius: 10, background: '#1F4A3A', color: '#fff', fontSize: 11, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>${unread}</span>`}

    <div className="scroll" ref=${sc}>${body}</div>
    ${s.toast && html`<div className="toast" role="status">${s.toast}</div>`}
    <nav className="nav" aria-label="Studio" style=${{ gridTemplateColumns: 'repeat(4,minmax(0,1fr))' }}>
      <button className=${navT === 'dash' ? 'on' : ''} onClick=${tab('dash')}><${Icon} n="chart" s="22" />Dashboard</button>
      <button className=${navT === 'catalog' ? 'on' : ''} onClick=${tab('catalog')}><${Icon} n="grid" s="22" />Catalog</button>
      <button className=${navT === 'orders' ? 'on' : ''} onClick=${tab('orders')}><${Icon} n="inbox" s="22" />Orders${newCount ? ' (' + newCount + ')' : ''}</button>
      <button className=${navT === 'profile' ? 'on' : ''} onClick=${tab('profile')}><${Icon} n="user" s="22" />Profile</button>
    </nav>

}

/* =====================================================================
   ROOT
   ===================================================================== */
function Root() {
  const [view, setView] = useState('customer');
  const [events, setEvents] = useState([]);
  const [unseen, setUnseen] = useState(0);
  const [newW, setNewW] = useState([]);
  const [newP, setNewP] = useState([]);
  const [unseenC, setUnseenC] = useState(0);
  const [sEvents, setSEvents] = useState([]);
  const onEvent = (e) => { setEvents((ev) => [...ev, { ...e, id: ev.length + 1 }]); if (e.artistId === 'ananya') setUnseen((n) => n + 1); };
  const onStudioEvent = (e) => { setSEvents((ev) => [...ev, e]); setUnseenC((n) => n + 1); };
  const pick = (v) => { setView(v); if (v === 'studio') setUnseen(0); else setUnseenC(0); };
  return html`<div className="page">
    <div className="topbar">
      <span className="brand"><span style=${{ color: '#1F4A3A' }}>Kala</span><span style=${{ color: '#B5532E' }}>Wiz</span></span>
      <span className="caption">Clickable prototype with sample data. Buy something or book a workshop from Ananya as a customer, then switch to Artist Studio to see it arrive.</span>
      <div className="switch" role="tablist" aria-label="Choose app">
        <button role="tab" aria-selected=${view === 'customer'} className=${view === 'customer' ? 'on' : ''} onClick=${() => pick('customer')}>Customer app${unseenC ? html` <span className="dot">${unseenC}</span>` : ''}</button>
        <button role="tab" aria-selected=${view === 'studio'} className=${view === 'studio' ? 'on' : ''} onClick=${() => pick('studio')}>Artist Studio${unseen ? html` <span className="dot">${unseen}</span>` : ''}</button>
      </div>
    </div>
    <div className="phone">
      <div style=${{ display: view === 'customer' ? 'contents' : 'none' }}><${CustomerApp} onEvent=${onEvent} extraWorkshops=${newW} extraProducts=${newP} studioEvents=${sEvents} /></div>
      <div style=${{ display: view === 'studio' ? 'contents' : 'none' }}><${StudioApp} events=${events} onStudioEvent=${onStudioEvent} onPublishWorkshop=${(w) => { setNewW((x) => [...x, w]); setUnseenC((n) => n + 1); }} onPublishProduct=${(p) => { setNewP((x) => [p, ...x]); setUnseenC((n) => n + 1); }} /></div>
    </div>
  </div>`;
}


/* mouse drag-to-scroll, like swiping on a phone */
(function () {
  let st = null, suppress = false;
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    if (e.target.closest('input,textarea,select,label')) return;
    const v = e.target.closest('.scroll'); if (!v) return;
    st = { x: e.clientX, y: e.clientY, v, h: e.target.closest('.hscroll'), top: v.scrollTop, left: 0, mode: null };
    if (st.h) st.left = st.h.scrollLeft;
  });
  document.addEventListener('pointermove', (e) => {
    if (!st) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.mode) {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      st.mode = st.h && Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
      document.body.classList.add('dragging');
    }
    if (st.mode === 'h') st.h.scrollLeft = st.left - dx; else st.v.scrollTop = st.top - dy;
  });
  const end = () => { if (st && st.mode) { suppress = true; setTimeout(() => { suppress = false; }, 0); } st = null; document.body.classList.remove('dragging'); };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
  document.addEventListener('click', (e) => { if (suppress) { e.preventDefault(); e.stopPropagation(); suppress = false; } }, true);
  document.addEventListener('dragstart', (e) => { if (e.target.closest && e.target.closest('.scroll')) e.preventDefault(); });
  /* vertical mouse wheel over a sideways row scrolls it sideways */
  document.addEventListener('wheel', (e) => {
    const h = e.target.closest && e.target.closest('.hscroll'); if (!h || e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    const max = h.scrollWidth - h.clientWidth; if (max <= 0) return;
    const next = Math.max(0, Math.min(max, h.scrollLeft + e.deltaY));
    if (next !== h.scrollLeft) { h.scrollLeft = next; e.preventDefault(); }
  }, { passive: false });
})();

ReactDOM.createRoot(document.getElementById('root')).render(html`<${Root} />`);
})();
</script>
